# BOSCH Flow auf dem vorhandenen nginx-Server (wie klima/climate).
# Die App lauscht nur lokal auf 127.0.0.1:${APP_PORT:-8504}; nginx leitet flow.sommer-nt.de dorthin.
# Start:  cd deploy && docker compose -p flow up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-8504}:8501"
