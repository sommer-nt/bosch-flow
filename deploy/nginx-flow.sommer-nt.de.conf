# nginx-Konfiguration für flow.sommer-nt.de → BOSCH Flow (Docker, Port 8504)
# Ablage:  /etc/nginx/sites-available/flow.sommer-nt.de
# HTTPS danach mit:  sudo certbot --nginx -d flow.sommer-nt.de
server {
    listen 80;
    listen [::]:80;
    server_name flow.sommer-nt.de;

    # Projektdateien (.json) hochladen
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8504;
        proxy_http_version 1.1;

        # WebSocket – ohne diese Zeilen bleibt die Streamlit-Seite weiß
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 600;
        proxy_buffering off;
    }
}
