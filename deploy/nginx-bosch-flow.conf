# nginx-Site für Bosch Flow (Streamlit hinter Reverse Proxy).
# Installiert nach /etc/nginx/sites-available/bosch-flow (macht deploy/install.sh).
# server_name anpassen. HTTPS danach z. B. mit:  sudo certbot --nginx -d flow.example.de

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name flow.example.de;

    # Projektdateien (.json) hochladen
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit arbeitet über WebSockets (/_stcore/stream) – ohne diese Zeilen bleibt die Seite leer.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # offene Sitzungen nicht nach 60 s trennen
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
