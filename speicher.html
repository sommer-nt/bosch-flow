<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bosch Speicherauswahl</title>
<style>
  :root{
    --bosch:#e20015; --bosch-blue:#005691; --bosch-blue-2:#008ecf; --bosch-violet:#50237f; --bosch-fuchsia:#b90276;
    --ink:#141e29; --ink-soft:#4a5866; --ink-faint:#78889a;
    --line:#d3dce5; --line-soft:#e6ecf2;
    --paper:#ffffff; --panel:#f4f7fa; --panel2:#eaf0f5;
    --ok:#2e7d32; --ok-bg:#e4f1e5; --warn:#a35f00; --warn-bg:#fdf0dc; --bad:#c0161d; --bad-bg:#fbe5e6;
    --accent:#005691; --accent-bg:rgba(0,86,145,.08);
    /* Kategorien wie in der Excel-Matrix */
    --k-puffer:#92d050; --k-ww:#ffc000; --k-biv:#bdd7ee; --k-kombi:#cc99ff;
    --shadow:0 1px 2px rgba(11,42,64,.05), 0 2px 8px rgba(11,42,64,.06);
    --shadow-lg:0 2px 6px rgba(11,42,64,.06), 0 12px 32px rgba(11,42,64,.10);
    --radius:14px; --radius-sm:9px;
  }
  [data-theme="dark"]{
    --ink:#e6edf3; --ink-soft:#9fb0c0; --ink-faint:#6b7d8d;
    --line:#2a3742; --line-soft:#222e38;
    --paper:#151d25; --panel:#1b242d; --panel2:#10171d;
    --bosch-blue:#2ba6e0; --accent:#2ba6e0; --accent-bg:rgba(43,166,224,.12);
    --ok:#5cc26a; --ok-bg:#16321c; --warn:#e0a33a; --warn-bg:#3a2a10; --bad:#ff6b6b; --bad-bg:#3a1517;
    --k-puffer:#5f8f2c; --k-ww:#a77d00; --k-biv:#3d6285; --k-kombi:#7a4fae;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
       background:linear-gradient(180deg,#eef3f8 0%,#e7eef4 100%);background-attachment:fixed;font-size:14px;line-height:1.45;min-height:100vh}
  [data-theme="dark"] body{background:linear-gradient(180deg,#0c1218 0%,#0f171e 100%)}
  .wrap{max-width:min(1500px,96vw);margin:0 auto;padding:0 16px 64px}
  header.top{background:var(--paper);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:20px;box-shadow:var(--shadow);position:relative}
  header.top::after{content:"";position:absolute;left:0;bottom:-1px;height:3px;width:100%;
       background:linear-gradient(90deg,var(--bosch) 0%,var(--bosch-fuchsia) 22%,var(--bosch-violet) 44%,var(--bosch-blue) 70%,var(--bosch-blue-2) 100%)}
  header.top .wrap{padding-bottom:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-weight:800;letter-spacing:.3px;font-size:20px;color:var(--bosch)}
  .logo span{color:var(--ink)}
  .subtitle{color:var(--ink-soft);font-size:13px}
  .badge{font-size:12px;color:var(--ink-soft);background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:20px}
  .badge b{color:var(--bosch-blue)}
  .kopf-rechts{margin-left:auto;display:flex;gap:8px;align-items:center}
  .knopf{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);border-radius:20px;height:32px;padding:0 12px;
         cursor:pointer;font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
  .knopf:hover{border-color:var(--bosch-blue);color:var(--bosch-blue)}
  .knopf.primaer{background:var(--bosch-blue);border-color:var(--bosch-blue);color:#fff}
  .knopf.primaer:hover{filter:brightness(1.08);color:#fff}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
  .card > h2{margin:0;font-size:15px;padding:12px 18px;border-bottom:1px solid var(--line-soft);color:var(--bosch-blue);
             display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card > h2 small{font-weight:400;color:var(--ink-faint);font-size:12px}
  .card .inhalt{padding:16px 18px}

  .modus{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
  .modus button{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-weight:600;padding:6px 16px;border-radius:999px;cursor:pointer}
  .modus button.an{background:var(--paper);color:var(--bosch-blue);box-shadow:var(--shadow)}

  .auswahl{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr) auto;gap:14px;align-items:end}
  label.feld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-soft)}
  select,input[type=search]{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--paper);
         border:1.5px solid #9aa6b2;border-radius:10px;padding:8px 10px;width:100%;min-width:0}
  [data-theme="dark"] select,[data-theme="dark"] input[type=search]{border-color:rgba(255,255,255,.3);background:var(--panel2)}
  select:focus,input:focus{outline:0;border-color:var(--bosch-blue);box-shadow:0 0 0 3px var(--accent-bg)}
  .schalter{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);padding-bottom:8px}
  .schalter label{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}

  /* Ergebnis-Matrix */
  .spalten{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .spalte{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--paper);min-width:0}
  .spalte h3{margin:0;font-size:13.5px;padding:8px 12px;color:#141e29;display:flex;justify-content:space-between;align-items:center}
  [data-theme="dark"] .spalte h3{color:#fff}
  .spalte h3 span{font-weight:600;font-size:12px;opacity:.75}
  .spalte[data-k=puffer] h3{background:var(--k-puffer)} .spalte[data-k=ww] h3{background:var(--k-ww)}
  .spalte[data-k=biv] h3{background:var(--k-biv)} .spalte[data-k=kombi] h3{background:var(--k-kombi)}
  .spalte ul{list-style:none;margin:0;padding:6px}
  .spalte li.leer{color:var(--ink-faint);font-size:12.5px;padding:8px 6px}
  .sp{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;font:inherit;color:inherit;
      padding:7px 8px;border-radius:8px;cursor:pointer}
  .sp:hover{background:var(--panel);border-color:var(--line)}
  .sp.an{background:var(--accent-bg);border-color:var(--bosch-blue)}
  .sp b{font-weight:650;font-size:14px}
  .sp .zeile2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px;font-size:11.5px;color:var(--ink-faint)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.2px;border-radius:999px;padding:1px 7px;
       background:var(--panel2);color:var(--ink-soft)}
  .tag.alt{background:var(--bad-bg);color:var(--bad)}
  .tag.bed{background:var(--warn-bg);color:var(--warn)}
  .tag.zwei{background:var(--accent-bg);color:var(--bosch-blue)}
  .tag.ok{background:var(--ok-bg);color:var(--ok)}
  .tag.notiz{background:var(--warn-bg);color:var(--warn)}

  /* Detail */
  .detail-kopf{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .detail-kopf h1{margin:0;font-size:24px;line-height:1.15}
  .detail-kopf .meta{color:var(--ink-soft);font-size:13px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .detail-kopf .links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .detail-raster{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:18px;margin-top:16px}
  .massbild{border:1px dashed var(--line);border-radius:var(--radius-sm);background:var(--panel);min-height:220px;
            display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink-faint);font-size:12.5px;padding:14px}
  .massbild img{max-width:100%;max-height:520px;background:#fff;border-radius:6px}
  table.daten{border-collapse:collapse;width:100%;font-size:13px}
  table.daten td{padding:5px 8px;border-bottom:1px solid var(--line-soft)}
  table.daten td:first-child{color:var(--ink-soft);width:45%}
  .hinweis{font-size:12.5px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;margin:8px 0}
  .hinweis.info{background:var(--accent-bg);color:var(--bosch-blue)}
  h4{margin:16px 0 8px;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px}

  .heizer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .hz{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--paper);min-width:0}
  .hz .foto{height:96px;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line-soft)}
  .hz .foto img{max-height:84px;max-width:90%}
  .hz.aus{opacity:.45}
  .hz h5{margin:0;font-size:13px;padding:8px 10px 2px}
  .hz .unter{font-size:11.5px;color:var(--ink-faint);padding:0 10px 6px}
  .hz ul{list-style:none;margin:0;padding:0 10px 10px;font-size:13px}
  .hz li{padding:5px 0;border-top:1px solid var(--line-soft)}
  .hz li small{color:var(--ink-faint);display:block}
  .ttnr{font-variant-numeric:tabular-nums;cursor:copy;border-bottom:1px dotted var(--ink-faint)}

  .wpliste{display:flex;flex-wrap:wrap;gap:6px}
  .wpliste button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
  .wpliste button:hover{border-color:var(--bosch-blue);color:var(--bosch-blue)}
  .wpliste button.bed{border-color:var(--warn);color:var(--warn)}
  .wpfam{margin:6px 0 10px}
  .wpfam > div:first-child{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}

  .trefferliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
  footer{font-size:12px;color:var(--ink-faint);margin-top:18px}
  footer ul{margin:4px 0 0;padding-left:18px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 14px;
         border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.an{opacity:.92}
  [hidden]{display:none !important}

  @media (max-width:1000px){
    .spalten,.heizer{grid-template-columns:repeat(2,minmax(0,1fr))}
    .detail-raster{grid-template-columns:1fr}
  }
  @media (max-width:640px){
    .auswahl{grid-template-columns:1fr}
    .spalten,.heizer{grid-template-columns:1fr}
    .detail-kopf .links{margin-left:0}
    .modus button{padding:6px 10px;font-size:13px;white-space:nowrap}
    .kopf-rechts{margin-left:0}
    select,input{font-size:16px}
  }
  @media print{
    header.top .kopf-rechts,.modus,.schalter,#karteAuswahl .auswahl{display:none}
    body{background:#fff}
    .card{box-shadow:none;break-inside:avoid}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo">BOSCH <span>Speicherauswahl</span></div>
    <div class="subtitle">Wärmepumpe → Speicher → E-Heizer</div>
    <div class="badge" id="stand"></div>
    <div class="kopf-rechts">
      <button class="knopf" onclick="window.print()" title="Auswahl drucken / als PDF speichern">🖶 Drucken</button>
      <button class="knopf" id="themeToggle" onclick="toggleTheme()" title="Hell / Dunkel umschalten">☀ / ☾</button>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="card" id="karteAuswahl">
    <h2>
      <div class="modus" role="tablist">
        <button id="mWp" class="an" onclick="setzeModus('wp')">Über Wärmepumpe</button>
        <button id="mSp" onclick="setzeModus('sp')">Über Speicher / TTNr</button>
      </div>
    </h2>
    <div class="inhalt">
      <div class="auswahl" id="auswahlWp">
        <label class="feld">Baureihe<select id="familie"></select></label>
        <label class="feld">Wärmepumpe<select id="wp"></select></label>
        <div class="schalter">
          <label><input type="checkbox" id="alte" checked> auslaufende Speicher („Alt“)</label>
          <label><input type="checkbox" id="bedingte" checked> eingeschränkte Kombinationen</label>
        </div>
      </div>
      <div id="auswahlSp" hidden>
        <label class="feld">Speichername oder TTNr
          <input type="search" id="suche" placeholder="z. B. WPS 390, BH 200 oder 8732921683" autocomplete="off"></label>
        <div class="schalter" style="padding-top:8px"><span id="trefferInfo"></span></div>
      </div>
    </div>
  </section>

  <section class="card" id="karteErgebnis">
    <h2 id="ergebnisTitel">Zugelassene Speicher</h2>
    <div class="inhalt" id="ergebnis"></div>
  </section>

  <section class="card" id="karteDetail" hidden>
    <div class="inhalt" id="detail"></div>
  </section>

  <footer id="fuss"></footer>
</div>
<div class="toast" id="toast"></div>

<script id="logik">
// Auswahl-Logik – identisch zu bosch_flow/speicher.py (tests/test_speicher.py vergleicht beide)
const DOKU_SUCHE = "https://bosch-de-de.boschhc-documents.com/td/?query={q}&sort-type=score&sort-direction=desc&language=de";
const WW_HINWEIS = "abweichend bei Wasser-Wasser-Betrieb";

function normname(name){ return String(name||"").toUpperCase().replace(/[^A-Z0-9]/g, ""); }

function bewertung(code){
  const c = String(code||"").replace(/\s+/g, "");
  if(!c) return ["", ""];
  if(c.includes("(-)")) return ["bedingt", (c.startsWith("+") ? "möglich, " : "") + WW_HINWEIS];
  if(c === "+/++") return ["ja", "ggf. zwei Speichereinheiten"];
  if(c === "++") return ["ja", "zwei Speichereinheiten"];
  if(c === "+") return ["ja", ""];
  if(c === "-") return ["nein", ""];
  return ["bedingt", code];
}

function wpNachId(d, id){ return d.wp.find(w => w.id === id) || null; }
function speicherNachId(d, id){ return d.speicher.find(s => s.id === id) || null; }

function speicherFuerWp(d, wpId, alte = true, bedingte = true){
  const erg = {}; for(const k in d.kategorien) erg[k] = [];
  for(const s of d.speicher){
    if(!s.matrix || (s.alt && !alte)) continue;
    const [status, zusatz] = bewertung(s.kombi[wpId] || "");
    if(status === "ja" || (status === "bedingt" && bedingte))
      erg[s.kategorie].push({id: s.id, status, zusatz, code: s.kombi[wpId] || "", notiz: s.notiz[wpId] || ""});
  }
  return erg;
}

function wpsFuerSpeicher(d, sid){
  const s = speicherNachId(d, sid), erg = [];
  for(const w of d.wp){
    const [status, zusatz] = s ? bewertung(s.kombi[w.id] || "") : ["", ""];
    if(status === "ja" || status === "bedingt") erg.push({id: w.id, status, zusatz, notiz: s.notiz[w.id] || ""});
  }
  return erg;
}

function heizerFuerSpeicher(d, sid){
  const s = speicherNachId(d, sid), erg = {};
  for(const k in d.heizertypen) erg[k] = [];
  const eh = (s && s.eheizer) || {};
  for(const [hid, status] of Object.entries(eh.heizer || {}))
    if(status === "ja" || status === "hzg") erg[d.heizer[hid].typ].push({id: hid, status});
  const sortKey = e => [d.heizer[e.id].leistung_kw || 0, d.heizer[e.id].spannung];
  for(const k in erg) erg[k].sort((a, b) => {
    const x = sortKey(a), y = sortKey(b);
    return x[0] - y[0] || (x[1] < y[1] ? -1 : x[1] > y[1] ? 1 : 0);
  });
  return erg;
}

function suche(d, text){
  const q = normname(text);
  if(!q) return [];
  return d.speicher.filter(s => normname(s.name).includes(q) || s.ttnr.some(t => t.includes(q))
      || normname((s.eheizer || {}).name_heizerliste || "").includes(q)).map(s => s.id);
}

function dokuLink(s){
  const q = s.ttnr && s.ttnr.length ? s.ttnr[0] : s.name;
  return DOKU_SUCHE.replace("{q}", q.replace(/\s+/g, "+"));
}
if(typeof module !== "undefined") module.exports = {normname, bewertung, speicherFuerWp, wpsFuerSpeicher, heizerFuerSpeicher, suche, dokuLink};
</script>

// ===================================================================== Oberfläche
const D = DATEN;
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TITEL = {
  volumen_l:"Volumen (l)", hoehe_mm:"Höhe (mm)", durchmesser_mm:"Ø (mm)", breite_mm:"Breite (mm)", tiefe_mm:"Tiefe (mm)",
  kippmass_mm:"Kippmaß (mm)", gewicht_kg:"Gewicht (kg)", waermetauscher_m2:"Wärmetauscher (m²)",
  anschluss_ww:"Anschluss WW", anschluss_hz:"Anschluss HZ", anschluss_wp:"Anschluss WP", bemerkung:"Bemerkung"};
const zustand = {modus:"wp", wp:null, sp:null};

function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("an"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("an"),1600); }
function kopieren(t){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast(`TTNr ${t} kopiert`), ()=>toast(t)); }
document.addEventListener("click", e => { const t = e.target.closest("[data-kopie]"); if(t){ e.stopPropagation(); kopieren(t.dataset.kopie); }});
const ttnrHtml = t => `<span class="ttnr" data-kopie="${esc(t)}" title="Klicken zum Kopieren">${esc(t)}</span>`;

function toggleTheme(){
  const r=document.documentElement, dunkel=r.getAttribute("data-theme")==="dark";
  if(dunkel) r.removeAttribute("data-theme"); else r.setAttribute("data-theme","dark");
  try{ localStorage.setItem("speicher-theme", dunkel ? "light" : "dark"); }catch(e){}
}
(function(){
  let t=null; try{ t=localStorage.getItem("speicher-theme"); }catch(e){}
  if(t==="dark" || (!t && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches))
    document.documentElement.setAttribute("data-theme","dark");
})();

// ---------- Auswahlfelder
const familien = [...new Set(D.wp.map(w => w.familie))];
$("familie").innerHTML = familien.map(f => `<option>${esc(f)}</option>`).join("");
function fuelleWp(){
  const f = $("familie").value;
  $("wp").innerHTML = D.wp.filter(w => w.familie === f).map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join("");
}
$("familie").addEventListener("change", () => { fuelleWp(); zustand.wp = $("wp").value; zustand.sp = null; zeige(); });
$("wp").addEventListener("change", () => { zustand.wp = $("wp").value; zustand.sp = null; zeige(); });
$("alte").addEventListener("change", zeige);
$("bedingte").addEventListener("change", zeige);
$("suche").addEventListener("input", zeige);

function setzeModus(m){
  zustand.modus = m;
  $("mWp").classList.toggle("an", m === "wp"); $("mSp").classList.toggle("an", m === "sp");
  $("auswahlWp").hidden = m !== "wp"; $("auswahlSp").hidden = m !== "sp";
  if(m === "sp") setTimeout(() => $("suche").focus(), 0);
  zeige();
}
function waehleSpeicher(id){ zustand.sp = (zustand.sp === id ? null : id); zeige(); if(zustand.sp) $("karteDetail").scrollIntoView({behavior:"smooth", block:"start"}); }
function waehleWp(id){
  const w = wpNachId(D, id); if(!w) return;
  $("familie").value = w.familie; fuelleWp(); $("wp").value = id; zustand.wp = id;
  setzeModus("wp"); window.scrollTo({top:0, behavior:"smooth"});
}

// ---------- Speicher-Kachel (Liste)
function spKnopf(s, e){
  const tags = [];
  if(s.info) tags.push(`<span class="tag">${esc(s.info)}</span>`);
  if(s.alt) tags.push(`<span class="tag alt" title="auslaufendes Produkt">Alt</span>`);
  if(e && e.status === "bedingt") tags.push(`<span class="tag bed" title="${esc(e.zusatz)}">${esc(e.code)} eingeschränkt</span>`);
  else if(e && e.zusatz) tags.push(`<span class="tag zwei">${esc(e.zusatz)}</span>`);
  if(e && e.notiz) tags.push(`<span class="tag notiz" title="${esc(e.notiz)}">ⓘ ${esc(e.notiz.length > 34 ? e.notiz.slice(0, 32) + "…" : e.notiz)}</span>`);
  const ttnr = s.ttnr.length ? s.ttnr.join(" / ") : (s.ttnr_hinweis || "TTNr fehlt");
  return `<button class="sp${zustand.sp === s.id ? " an" : ""}" onclick="waehleSpeicher('${s.id}')">
    <b>${esc(s.name)}</b><div class="zeile2"><span>${esc(ttnr)}</span>${tags.join("")}</div></button>`;
}

function zeigeWp(){
  const w = wpNachId(D, zustand.wp);
  const erg = speicherFuerWp(D, zustand.wp, $("alte").checked, $("bedingte").checked);
  const n = Object.values(erg).reduce((a, l) => a + l.length, 0);
  $("ergebnisTitel").innerHTML = `Zugelassene Speicher für <span style="color:var(--ink)">${esc(w.name)}</span> <small>${n} Speicher · Klick zeigt Details und E-Heizer</small>`;
  $("ergebnis").innerHTML = `<div class="spalten">` + Object.entries(D.kategorien).map(([k, titel]) => `
    <div class="spalte" data-k="${k}"><h3>${esc(titel)}<span>${erg[k].length}</span></h3><ul>
      ${erg[k].length ? erg[k].map(e => `<li>${spKnopf(speicherNachId(D, e.id), e)}</li>`).join("") : `<li class="leer">kein freigegebener Speicher</li>`}
    </ul></div>`).join("") + `</div>`;
}

function zeigeSuche(){
  const q = $("suche").value.trim();
  const ids = q ? suche(D, q) : D.speicher.map(s => s.id);
  $("trefferInfo").textContent = q ? `${ids.length} Treffer` : `${ids.length} Speicher – inkl. Speicher für Gas-/Ölgeräte (nur E-Heizer-Daten)`;
  $("ergebnisTitel").innerHTML = q ? `Treffer für „${esc(q)}“` : `Alle Speicher`;
  if(ids.length === 1 && zustand.sp !== ids[0]) zustand.sp = ids[0];
  const proKat = {}; for(const k in D.kategorien) proKat[k] = [];
  ids.forEach(id => { const s = speicherNachId(D, id); proKat[s.kategorie].push(s); });
  $("ergebnis").innerHTML = `<div class="spalten">` + Object.entries(D.kategorien).map(([k, titel]) => `
    <div class="spalte" data-k="${k}"><h3>${esc(titel)}<span>${proKat[k].length}</span></h3><ul>
      ${proKat[k].length ? proKat[k].map(s => `<li>${spKnopf(s, null)}</li>`).join("") : `<li class="leer">–</li>`}
    </ul></div>`).join("") + `</div>`;
}

// ---------- Detail eines Speichers
function zeigeDetail(){
  const s = zustand.sp && speicherNachId(D, zustand.sp);
  $("karteDetail").hidden = !s;
  if(!s) return;
  const eh = s.eheizer || {};
  const bild = s.ttnr.map(t => BILDER[t]).find(Boolean) || BILDER[s.id];
  const kombi = zustand.modus === "wp" && s.matrix ? bewertung(s.kombi[zustand.wp] || "") : null;
  const w = wpNachId(D, zustand.wp);

  const links = [];
  if(s.im) links.push(`<a class="knopf primaer" href="${esc(s.im)}" target="_blank" rel="noopener">📄 Installationsanleitung</a>`);
  links.push(`<a class="knopf" href="${esc(dokuLink(s))}" target="_blank" rel="noopener" title="Bosch Dokumentensuche">🔎 Alle Dokumente</a>`);

  const daten = s.daten ? Object.entries(TITEL).filter(([k]) => s.daten[k]).map(([k, t]) => `<tr><td>${t}</td><td>${esc(s.daten[k])}</td></tr>`).join("") : "";
  const datenTab = `<table class="daten">
      <tr><td>TTNr</td><td>${s.ttnr.length ? s.ttnr.map(ttnrHtml).join(" / ") : esc(s.ttnr_hinweis || "–")}</td></tr>
      <tr><td>Kategorie</td><td>${esc(D.kategorien[s.kategorie])}${s.info ? " · " + esc(s.info) : ""}</td></tr>
      ${eh.tiefe_muffe_mm ? `<tr><td>max. Eintauchtiefe E-Muffe</td><td>${eh.tiefe_muffe_mm} mm</td></tr>` : ""}
      ${eh.tiefe_handloch_mm ? `<tr><td>max. Eintauchtiefe Handloch</td><td>${eh.tiefe_handloch_mm} mm</td></tr>` : ""}
      ${eh.handlochdeckel_ttnr ? `<tr><td>Handlochdeckel</td><td>${ttnrHtml(eh.handlochdeckel_ttnr)}</td></tr>` : ""}
      ${daten}
    </table>`;

  let kombiHtml = "";
  if(kombi && w){
    const notiz = s.notiz[zustand.wp];
    if(kombi[0] === "bedingt") kombiHtml = `<div class="hinweis">Mit ${esc(w.name)}: ${esc(kombi[1])} (Matrix: „${esc(s.kombi[zustand.wp])}“)</div>`;
    else if(kombi[1]) kombiHtml = `<div class="hinweis info">Mit ${esc(w.name)}: ${esc(kombi[1])}</div>`;
    if(notiz) kombiHtml += `<div class="hinweis">ⓘ ${esc(notiz)}</div>`;
  }

  // E-Heizer
  const hz = heizerFuerSpeicher(D, s.id);
  const nHz = Object.values(hz).reduce((a, l) => a + l.length, 0);
  const hzHtml = Object.entries(D.heizertypen).map(([typ, titel]) => {
    const liste = hz[typ];
    const unter = typ === "led_hd" && eh.handlochdeckel_ttnr ? `Handlochdeckel ${ttnrHtml(eh.handlochdeckel_ttnr)}` :
                  typ === "led" && eh.tiefe_muffe_mm ? `max. Eintauchtiefe ${eh.tiefe_muffe_mm} mm` :
                  typ === "led_hd" && eh.tiefe_handloch_mm ? `max. Eintauchtiefe ${eh.tiefe_handloch_mm} mm` : "&nbsp;";
    return `<div class="hz${liste.length ? "" : " aus"}">
      <div class="foto">${BILDER["heizer:" + typ] ? `<img src="${BILDER["heizer:" + typ]}" alt="${esc(titel)}">` : ""}</div>
      <h5>${esc(titel)}</h5><div class="unter">${unter}</div>
      <ul>${liste.length ? liste.map(e => { const h = D.heizer[e.id];
        return `<li><span>${esc(h.modell !== "E-Heater" ? h.modell + " · " : "")}${String(h.leistung_kw).replace(".", ",")} kW / ${esc(h.spannung)}
          ${e.status === "hzg" ? `<span class="tag bed" title="nur für Heizungsunterstützung">nur HZG</span>` : ""}</span>
          <small>${ttnrHtml(h.ttnr)} · ≥ ${h.einbautiefe_mm} mm</small></li>`; }).join("") : `<li><small>nicht freigegeben</small></li>`}</ul>
    </div>`;
  }).join("");

  // Freigegebene WP (Umkehrung)
  const wps = wpsFuerSpeicher(D, s.id);
  const fam = {}; wps.forEach(e => { const w2 = wpNachId(D, e.id); (fam[w2.familie] = fam[w2.familie] || []).push([w2, e]); });
  const wpHtml = s.matrix ? (wps.length ? Object.entries(fam).map(([f, l]) => `<div class="wpfam"><div>${esc(f)}</div><div class="wpliste">${
      l.map(([w2, e]) => `<button class="${e.status === "bedingt" ? "bed" : ""}" title="${esc([e.zusatz, e.notiz].filter(Boolean).join(" – "))}" onclick="waehleWp('${w2.id}')">${esc(w2.groesse)}</button>`).join("")}</div></div>`).join("")
      : `<div class="hinweis">Mit keiner Wärmepumpe der Matrix freigegeben.</div>`)
    : `<div class="hinweis info">Dieser Speicher steht nicht in der WP-Kombinationsmatrix (z. B. Speicher für Gas-/Ölgeräte) – hier nur E-Heizer-Daten.</div>`;

  $("detail").innerHTML = `
    <div class="detail-kopf">
      <div><h1>${esc(s.name)}</h1>
        <div class="meta">${s.ttnr.map(ttnrHtml).join(" / ")}<span class="tag">${esc(D.kategorien[s.kategorie])}</span>
          ${s.info ? `<span class="tag">${esc(s.info)}</span>` : ""}${s.alt ? `<span class="tag alt">Alt – auslaufend</span>` : ""}
          ${eh.name_heizerliste ? `<span>(in der E-Heizer-Liste: ${esc(eh.name_heizerliste)})</span>` : ""}</div></div>
      <div class="links">${links.join("")}</div>
    </div>
    ${kombiHtml}
    <div class="detail-raster">
      <div class="massbild">${bild ? `<img src="${bild}" alt="Maßbild ${esc(s.name)}">` :
        `<div>Maßbild noch nicht hinterlegt.<br>${s.im ? "Maße und Anschlüsse siehe Installationsanleitung." : ""}</div>`}</div>
      <div>${datenTab}
        ${s.daten ? "" : `<div class="hinweis info">Volumen, Maße und Anschlüsse folgen mit den SAP-Stammdaten.</div>`}
        <h4>Freigegeben für Wärmepumpen</h4>${wpHtml}
      </div>
    </div>
    <h4>Passende E-Heizer <small style="text-transform:none;letter-spacing:0;font-weight:400">${nHz ? nHz + " Varianten" : ""}</small></h4>
    ${eh.hinweis ? `<div class="hinweis">${esc(eh.hinweis)}</div>` : ""}
    ${s.eheizer ? `<div class="heizer">${hzHtml}</div>` : `<div class="hinweis info">Für diesen Speicher sind keine E-Heizer hinterlegt.</div>`}
    ${nHz ? `<div class="hinweis info">${esc(D.hinweise_heizer.join(" "))} TTNr anklicken zum Kopieren.</div>` : ""}`;
}

function zeige(){
  if(zustand.modus === "wp") zeigeWp(); else zeigeSuche();
  zeigeDetail();
  const h = zustand.modus === "wp" ? `#wp=${zustand.wp}` + (zustand.sp ? `&sp=${zustand.sp}` : "") : `#suche=${encodeURIComponent($("suche").value)}` + (zustand.sp ? `&sp=${zustand.sp}` : "");
  history.replaceState(null, "", h);
}

// ---------- Start
$("stand").innerHTML = `Matrix-Stand <b>${esc(D.stand || "–")}</b>`;
$("fuss").innerHTML = `<b>Legende Matrix:</b> + freigegeben · ++ zwei Speichereinheiten · (-)* abweichend bei Wasser-Wasser-Betrieb · ⓘ Hinweis zur Kombination
  <ul>${D.hinweise_matrix.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
  Quelle: ${esc(D.quelle)} · ${D.wp.length} Wärmepumpen · ${D.speicher.length} Speicher`;
(function(){
  const p = new URLSearchParams(location.hash.slice(1));
  const wpId = p.get("wp") && wpNachId(D, p.get("wp")) ? p.get("wp") : D.wp[0].id;
  $("familie").value = wpNachId(D, wpId).familie; fuelleWp(); $("wp").value = wpId; zustand.wp = wpId;
  if(p.get("sp") && speicherNachId(D, p.get("sp"))) zustand.sp = p.get("sp");
  if(p.has("suche")){ $("suche").value = p.get("suche"); setzeModus("sp"); } else zeige();
})();
</script>
</body>
</html>
